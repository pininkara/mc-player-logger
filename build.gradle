plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
}

version = mod_version
group = 'dev.presencelogger'

base { archivesName = 'player-presence-logger' }
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = project.neo_version
    runs {
        server {
            server()
            programArgument '--nogui'
        }
        client { client() }
    }
    mods {
        player_presence_logger { sourceSet sourceSets.main }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

// Capture plain values during configuration; file filters run at execution time.
def modResourceProperties = [mod_version: providers.gradleProperty('mod_version').get()]

tasks.named('processResources', ProcessResources) {
    inputs.properties modResourceProperties
    filesMatching('META-INF/neoforge.mods.toml') {
        expand modResourceProperties
    }
}

// This executable verification program is separate from JUnit/TestNG test sources.
sourceSets {
    verification {
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
}

tasks.register('verifyLogWriter', JavaExec) {
    group = 'verification'
    description = 'Checks CSV append, escaping, day rollover and configuration.'
    dependsOn tasks.named('verificationClasses')
    classpath = sourceSets.verification.runtimeClasspath
    mainClass = 'dev.presencelogger.LogWriterVerification'
}

tasks.named('check') { dependsOn tasks.named('verifyLogWriter') }
