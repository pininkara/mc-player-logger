name: Build and Release JAR

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Mod version, without v (for example 1.0.0 or 1.0.1-rc.1)'
        required: true
        default: '1.1.0'
        type: string
      prerelease:
        description: 'Mark the release as a pre-release'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      tag: ${{ steps.metadata.outputs.tag }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Validate version
        id: metadata
        env:
          MOD_VERSION: ${{ inputs.version }}
        run: |
          if [[ ! "$MOD_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z][0-9A-Za-z.-]*)?$ ]]; then
            echo '::error::Version must look like 1.0.0 or 1.0.1-rc.1, without v.'
            exit 1
          fi
          echo "tag=v${MOD_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle and dependency cache
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6

      - name: Compile and verify
        env:
          MOD_VERSION: ${{ inputs.version }}
        run: sh ./gradlew clean build --no-daemon --console=plain "-Pmod_version=${MOD_VERSION}"

      - name: Check JAR output
        env:
          MOD_VERSION: ${{ inputs.version }}
        run: test -s "build/libs/player-presence-logger-${MOD_VERSION}.jar"

      - name: Upload JAR artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: player-presence-logger-${{ inputs.version }}
          path: build/libs/player-presence-logger-${{ inputs.version }}.jar
          if-no-files-found: error
          retention-days: 14

  release:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ needs.build.outputs.tag }}
      MOD_VERSION: ${{ inputs.version }}
      PRERELEASE: ${{ inputs.prerelease }}
    steps:
      - name: Download the verified JAR
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: player-presence-logger-${{ inputs.version }}
          path: dist

      - name: Refuse an existing release tag
        run: |
          python3 - <<'PY'
          import os
          import urllib.error
          import urllib.parse
          import urllib.request

          tag = os.environ['RELEASE_TAG']
          url = (os.environ['GITHUB_API_URL'] + '/repos/' + os.environ['GH_REPO']
                 + '/git/ref/tags/' + urllib.parse.quote(tag, safe=''))
          request = urllib.request.Request(url, headers={
              'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
              'Accept': 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28',
          })
          try:
              with urllib.request.urlopen(request, timeout=30):
                  pass
          except urllib.error.HTTPError as error:
              if error.code != 404:
                  raise
          else:
              raise SystemExit(f'::error::Tag {tag} already exists. Choose a new version; existing releases are not overwritten.')
          PY

      - name: Publish GitHub Release
        run: |
          options=()
          if [[ "$PRERELEASE" == 'true' ]]; then
            options+=(--prerelease)
          fi
          gh release create "$RELEASE_TAG" \
            "dist/player-presence-logger-${MOD_VERSION}.jar" \
            --target "$GITHUB_SHA" \
            --title "Player Presence Logger ${MOD_VERSION} (MC 1.21.1 / NeoForge)" \
            --generate-notes \
            "${options[@]}"
